# Search experiments that need Workers AI (scripts/experiment.mjs). Runs when the
# `experiment-run` branch is pushed, or on demand; results go to the `experiments` branch.
# Uses the stored sources and vector cache; fetches and deploys nothing.
name: Experiment

on:
  push:
    branches: [experiment-run]
  workflow_dispatch:

concurrency:
  group: experiment
  cancel-in-progress: true

permissions:
  contents: write # the experiments branch

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pdfplumber
        run: pip install --quiet pdfplumber==0.11.10
      - name: Check out the stored sources and vector cache
        run: |
          git fetch --depth=1 origin sources && git worktree add .sources FETCH_HEAD
          git fetch --depth=1 origin vectors && git worktree add .vectors FETCH_HEAD
      # Sources named in the commit message as [fetch:ID,ID] are fetched into the stored
      # sources for this run only (nothing is pushed to the sources branch), and copied to
      # the results so parsing can be developed locally.
      - name: Fetch new sources
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          ids=$(printf '%s' "$MSG" | grep -o '\[fetch:[^]]*\]' | head -1 | sed 's/\[fetch:\(.*\)\]/\1/' || true)
          mkdir -p .exp/src
          if [ -n "$ids" ]; then
            node scripts/fetch.mjs --out .sources --only "$ids" || true
            cp .sources/manifest.json .sources/fetch-log.txt .exp/src/
            mkdir -p .exp/src/raw
            for id in $(echo "$ids" | tr ',' ' '); do cp .sources/raw/"$id".* .exp/src/raw/ 2>/dev/null || true; done
          fi
      - name: Build data
        run: node scripts/build-data.mjs --src .sources
      # With [embed] in the commit message: vectors for new or changed units and the
      # evaluation questions, written to the results only (no upload to Vectorize).
      - name: Embed (no upload)
        if: contains(github.event.head_commit.message, '[embed]')
        run: node scripts/embed.mjs --cache .vectors --queries && cp .vectors/vectors.json .exp/vectors.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Workers AI experiments run only when the pushed commit message contains [ai].
      - name: Run experiments
        if: contains(github.event.head_commit.message, '[ai]')
        run: node scripts/experiment.mjs --vectors .vectors/vectors.json --out .exp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Save results
        run: |
          cp data/remit.json .exp/remit.json
          cd .exp
          git init -q -b experiments
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Experiment results ${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:experiments
          cat experiment-log.txt src/fetch-log.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

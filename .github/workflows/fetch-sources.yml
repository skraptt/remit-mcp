# Downloads the source documents (EUR-Lex acts, ACER PDFs) and stores them on the
# `sources` branch, so they can be parsed and reviewed without network access.
name: Fetch sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/sources.mjs', 'scripts/fetch.mjs', '.github/workflows/fetch-sources.yml']

concurrency:
  group: fetch-sources
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out the sources branch
        run: |
          if git ls-remote --exit-code --heads origin sources >/dev/null; then
            git fetch --depth=1 origin sources
            git worktree add .sources FETCH_HEAD
          else
            git worktree add --orphan -b sources .sources
          fi
      - name: Fetch
        run: node scripts/fetch.mjs --out .sources
      - name: Commit
        run: |
          cd .sources
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B sources
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -q -m "Sources fetched $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:sources
      - name: Summary
        if: always()
        run: '[ -f .sources/fetch-log.txt ] && { echo "### Fetch log"; echo "\`\`\`"; cat .sources/fetch-log.txt; echo "\`\`\`"; } >> "$GITHUB_STEP_SUMMARY" || true'
